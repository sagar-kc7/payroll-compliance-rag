[project]
name = "nepal-compliance-rag"
version = "0.1.0"
description = "Grounded document-intelligence service for Nepali payroll & tax compliance"
requires-python = ">=3.12"
dependencies = [
    # Core RAG
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # Extraction
    "pydantic>=2.9.0",
    "instructor>=1.6.0",          # structured LLM output + validation retries
    # PDF ingestion
    "pymupdf>=1.24.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Evaluation
    "deepeval>=2.0.0",
    "langsmith>=0.1.140",
    # PII / safety
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: marks tests as DeepEval evaluation tests (deselect with -m 'not eval')",
]
